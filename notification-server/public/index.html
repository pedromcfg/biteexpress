<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controlo de Notificações - Bite Express</title>
  <style>
    :root {
      --bg: #020617;
      --bg-elevated: #0B1220;
      --panel: #111827;
      --border: #1F2937;
      --text: #F9FAFB;
      --muted: #9CA3AF;
      --muted-2: #6B7280;
      --green: #16A34A;
      --green-hover: #15803D;
      --green-soft: rgba(22, 163, 74, 0.18);
      --red: #DC2626;
      --red-hover: #B91C1C;
      --blue: #3B82F6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(22, 163, 74, 0.12), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(15, 23, 42, 0.9), transparent 50%),
        var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 28px 16px 48px;
      color: var(--text);
    }

    .container {
      background: rgba(11, 18, 32, 0.96);
      border-radius: 20px;
      padding: 32px;
      max-width: 640px;
      width: 100%;
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    h1 {
      color: var(--text);
      margin-bottom: 6px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 14px;
    }

    .server-info {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 14px 16px;
      margin-bottom: 28px;
      border-radius: 12px;
    }

    .url-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .url-row code {
      flex: 1;
      min-width: 180px;
      background: #020617;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: ui-monospace, 'Courier New', monospace;
      color: #86EFAC;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid var(--border);
      word-break: break-all;
    }

    .copy-btn {
      padding: 10px 14px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: var(--green-hover);
    }

    .messages-section {
      margin-bottom: 28px;
    }

    .section-title {
      color: #E5E7EB;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .section-hint {
      color: var(--muted);
      font-size: 12px;
      margin: -2px 0 14px;
      line-height: 1.45;
    }

    .message-button {
      width: 100%;
      padding: 14px 44px 14px 16px;
      margin-bottom: 10px;
      background: #0B1220;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
      text-align: left;
      position: relative;
    }

    .message-button:hover {
      background: #111827;
      border-color: rgba(22, 163, 74, 0.55);
      transform: translateY(-1px);
    }

    .message-button:active {
      transform: translateY(0);
    }

    .message-button::after {
      content: '→';
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--green);
    }

    .reset-button {
      width: 100%;
      padding: 14px 18px;
      margin-top: 8px;
      background: var(--red);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .reset-button:hover {
      background: var(--red-hover);
      transform: translateY(-1px);
    }

    .status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
    }

    .status.success {
      background: rgba(22, 163, 74, 0.15);
      color: #86EFAC;
      border: 1px solid rgba(22, 163, 74, 0.45);
      display: block;
    }

    .status.error {
      background: rgba(220, 38, 38, 0.15);
      color: #FCA5A5;
      border: 1px solid rgba(220, 38, 38, 0.45);
      display: block;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .tag-gps {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--green-soft);
      color: #4ADE80;
      font-size: 11px;
      font-weight: 700;
    }

    .tag-hud {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.18);
      color: #93C5FD;
      font-size: 11px;
      font-weight: 700;
    }

    .geo-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .geo-form label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .geo-form input,
    .geo-form select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #020617;
      color: var(--text);
    }

    .geo-form .full {
      grid-column: 1 / -1;
    }

    .geo-add-btn {
      width: 100%;
      padding: 12px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .geo-add-btn:hover {
      background: var(--green-hover);
    }

    .geo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .geo-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .geo-item strong {
      color: var(--text);
      font-size: 14px;
      display: block;
      margin-bottom: 4px;
    }

    .geo-item span {
      color: var(--muted);
      font-size: 12px;
      display: block;
      line-height: 1.4;
    }

    .geo-remove {
      background: rgba(220, 38, 38, 0.15);
      color: #FCA5A5;
      border: 1px solid rgba(220, 38, 38, 0.35);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .geo-remove:hover {
      background: rgba(220, 38, 38, 0.28);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Controlo de Notificações</h1>
    <p class="subtitle">GoYUM Driver · painel de cues para rodagem</p>

    <div class="server-info">
      <div class="url-row">
        <code id="serverIP">Carregando...</code>
        <button class="copy-btn" onclick="copyIP()">Copiar URL</button>
      </div>
    </div>

    <div class="messages-section">
      <h2 class="section-title">Cues do Guião</h2>

      <button class="message-button" onclick="sendCue('arrival_praise', this)">
        1. Chegou ao seu destino (4 barras)
      </button>

      <button class="message-button" onclick="sendCue('continue_shift_prompt', this)">
        2. Bonus 2xEUR (terminar / voltar online)
      </button>

      <button class="message-button" onclick="sendCue('new_order_drop', this)">
        3. Novo pedido — restaurante
      </button>

      <button class="message-button" onclick="sendCue('pickup_done_start_delivery', this)">
        4. Pedido recolhido — rota cliente
      </button>

      <button class="message-button" onclick="sendCue('urgent_only_ack', this)">
        5. Vamos la, Susana! Esta entrega e tua!
      </button>

      <button class="message-button" onclick="sendCue('timer_drop_yellow', this)">
        6. Rota atualizada / cronometro
      </button>

      <button class="message-button" onclick="sendCue('gps_continue_left', this)">
        7a. GPS: Continua / vira a esquerda
      </button>

      <button class="message-button" onclick="sendCue('wrong_route_red_2', this)">
        7b. Comida a ficar fria (2 barras)
      </button>

      <button class="message-button" onclick="sendCue('gps_turn_right', this)">
        8a. GPS: Vira a direita
      </button>

      <button class="message-button" onclick="sendCue('gps_continue', this)">
        8b. GPS: Continua em frente
      </button>

      <button class="message-button" onclick="sendCue('gps_glitch', this)">
        8c. GPS glitch (voz a falhar)
      </button>

      <button class="message-button" onclick="sendCue('client_unavailable', this)">
        9. Contactar Cliente — numero indisponivel
      </button>

      <button class="message-button" onclick="sendCue('support_bot_1', this)">
        10a. BOT Ana — saudacao
      </button>

      <button class="message-button" onclick="sendCue('support_bot_fail', this)">
        10b. BOT Ana — Tens a certeza…
      </button>

      <button class="message-button" onclick="sendCue('support_bot_3', this)">
        10c. BOT Ana — Espero ter ajudado
      </button>

      <button class="message-button" onclick="sendCue('final_break_red_1', this)">
        11. Despacha-te! (1 barra)
      </button>

      <button class="reset-button" onclick="resetCues(this)">
        Reset Cues (novo take)
      </button>
    </div>

    <div id="geofencesSection" class="messages-section" style="display:none;">
      <h2 class="section-title">Geofences GPS</h2>
      <p class="section-hint">
        Cola lat/lng do Maps. Ao chegar dentro do raio, a app dispara a cue escolhida.
        Reset Cues limpa “já disparou”, não apaga estes pontos.
      </p>

      <form id="geofenceForm" class="geo-form" onsubmit="return addGeofence(event)">
        <div class="full">
          <label for="geoLabel">Etiqueta</label>
          <input id="geoLabel" type="text" placeholder="ex: Porta do restaurante" />
        </div>
        <div>
          <label for="geoLat">Latitude</label>
          <input id="geoLat" type="number" step="any" required placeholder="41.1525" />
        </div>
        <div>
          <label for="geoLng">Longitude</label>
          <input id="geoLng" type="number" step="any" required placeholder="-8.6205" />
        </div>
        <div>
          <label for="geoRadius">Raio (metros)</label>
          <input id="geoRadius" type="number" min="10" max="5000" value="80" required />
        </div>
        <div>
          <label for="geoCue">Cue a disparar</label>
          <select id="geoCue" required>
            <option value="">A carregar…</option>
          </select>
        </div>
        <div class="full">
          <button type="submit" class="geo-add-btn">Adicionar geofence</button>
        </div>
      </form>

      <div id="geofenceList" class="geo-list"></div>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script>
    // true = mostrar configuracao de geofences no painel
    const SHOW_GEOFENCES_UI = false;
    const serverUrl = window.location.origin;

    // Busca o IP/URL real do servidor
    fetch('/discover')
      .then(res => res.json())
      .then(data => {
        const ipElement = document.getElementById('serverIP');
        ipElement.textContent = data.url || serverUrl;
        ipElement.dataset.ip = data.url || serverUrl;
      })
      .catch(err => {
        const ipElement = document.getElementById('serverIP');
        ipElement.textContent = serverUrl;
        ipElement.dataset.ip = serverUrl;
      });

    function copyIP() {
      const ip = document.getElementById('serverIP').dataset.ip || document.getElementById('serverIP').textContent;
      navigator.clipboard.writeText(ip).then(() => {
        const button = document.querySelector('.copy-btn');
        const originalText = button.textContent;
        button.textContent = 'Copiado';
        button.style.background = '#15803D';
        setTimeout(() => {
          button.textContent = originalText;
          button.style.background = '';
        }, 2000);
      }).catch(err => {
        alert('Erro ao copiar. IP: ' + ip);
      });
    }

    async function sendNotification(messageIndex, buttonEl) {
      await postNotification({ messageIndex }, buttonEl);
    }

    async function sendCue(cueKey, buttonEl) {
      await postNotification({ cueKey }, buttonEl);
    }

    async function postNotification(payload, buttonEl) {
      const statusEl = document.getElementById('status');
      const button = buttonEl;
      const originalText = button.innerHTML;
      
      // Mostra loading
      button.innerHTML = '<span class="loading"></span> Enviando...';
      button.disabled = true;
      statusEl.className = 'status';

      try {
        const response = await fetch('/notifications', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          statusEl.className = 'status success';
          statusEl.textContent = `✅ Notificação enviada com sucesso!`;
          
          // Reset após 3 segundos
          setTimeout(() => {
            statusEl.className = 'status';
          }, 3000);
        } else {
          throw new Error(data.error || 'Erro ao enviar notificação');
        }
      } catch (error) {
        statusEl.className = 'status error';
        statusEl.textContent = `❌ Erro: ${error.message}`;
      } finally {
        button.innerHTML = originalText;
        button.disabled = false;
      }
    }

    async function resetCues(buttonEl) {
      const statusEl = document.getElementById('status');
      const button = buttonEl;
      const originalText = button.innerHTML;

      button.innerHTML = '<span class="loading"></span> A reiniciar...';
      button.disabled = true;
      statusEl.className = 'status';

      try {
        const response = await fetch('/reset', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          }
        });

        const data = await response.json();

        if (response.ok) {
          statusEl.className = 'status success';
          statusEl.textContent = '🔄 Cues reiniciadas. Estado pronto para novo take.';
          setTimeout(() => {
            statusEl.className = 'status';
          }, 3000);
        } else {
          throw new Error(data.error || 'Erro ao reiniciar cues');
        }
      } catch (error) {
        statusEl.className = 'status error';
        statusEl.textContent = `❌ Erro: ${error.message}`;
      } finally {
        button.innerHTML = originalText;
        button.disabled = false;
      }
    }

    const CUE_LABELS = {
      arrival_praise: '1. Chegou ao destino',
      continue_shift_prompt: '2. Bonus 2xEUR',
      new_order_drop: '3. Novo pedido',
      pickup_done_start_delivery: '4. Pedido recolhido',
      urgent_only_ack: '5. Vamos la, Susana',
      timer_drop_yellow: '6. Rota / cronometro',
      gps_continue_left: '7a. GPS esquerda',
      wrong_route_red_2: '7b. Comida fria',
      gps_turn_right: '8a. GPS direita',
      gps_continue: '8b. GPS continua',
      gps_glitch: '8c. GPS glitch',
      client_unavailable: '9. Cliente indisponivel',
      support_bot_1: '10a. BOT Ana 1',
      support_bot_fail: '10b. BOT Ana 2',
      support_bot_3: '10c. BOT Ana 3',
      final_break_red_1: '11. Despacha-te'
    };

    async function loadCueOptions() {
      const select = document.getElementById('geoCue');
      try {
        const res = await fetch('/cues');
        const data = await res.json();
        const keys = Object.keys(data.cues || {});
        select.innerHTML = keys
          .map((key) => `<option value="${key}">${CUE_LABELS[key] || key}</option>`)
          .join('');
      } catch (e) {
        select.innerHTML = '<option value="">Erro ao carregar cues</option>';
      }
    }

    function renderGeofences(geofences) {
      const list = document.getElementById('geofenceList');
      if (!geofences || geofences.length === 0) {
        list.innerHTML = '<p style="color:#718096;font-size:13px;">Nenhum geofence activo.</p>';
        return;
      }
      list.innerHTML = geofences
        .map(
          (g) => `
        <div class="geo-item">
          <div>
            <strong>${g.label}</strong>
            <span>${g.latitude}, ${g.longitude} · raio ${g.radiusMeters}m</span>
            <span>Cue: ${CUE_LABELS[g.cueKey] || g.cueKey}${g.enabled === false ? ' · desligado' : ''}</span>
          </div>
          <button type="button" class="geo-remove" onclick="removeGeofence('${g.id}')">Remover</button>
        </div>`
        )
        .join('');
    }

    async function loadGeofences() {
      try {
        const res = await fetch('/geofences');
        const data = await res.json();
        renderGeofences(data.geofences || []);
      } catch (e) {
        document.getElementById('geofenceList').innerHTML =
          '<p style="color:#b91c1c;font-size:13px;">Erro ao carregar geofences.</p>';
      }
    }

    async function addGeofence(event) {
      event.preventDefault();
      const statusEl = document.getElementById('status');
      const payload = {
        label: document.getElementById('geoLabel').value.trim() || undefined,
        latitude: Number(document.getElementById('geoLat').value),
        longitude: Number(document.getElementById('geoLng').value),
        radiusMeters: Number(document.getElementById('geoRadius').value),
        cueKey: document.getElementById('geoCue').value
      };

      statusEl.className = 'status';
      try {
        const res = await fetch('/geofences', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao criar geofence');
        renderGeofences(data.geofences || []);
        document.getElementById('geoLabel').value = '';
        document.getElementById('geoLat').value = '';
        document.getElementById('geoLng').value = '';
        document.getElementById('geoRadius').value = '80';
        statusEl.className = 'status success';
        statusEl.textContent = '📍 Geofence adicionado. A app actualiza em breve.';
        setTimeout(() => {
          statusEl.className = 'status';
        }, 3000);
      } catch (error) {
        statusEl.className = 'status error';
        statusEl.textContent = `❌ Erro: ${error.message}`;
      }
      return false;
    }

    async function removeGeofence(id) {
      const statusEl = document.getElementById('status');
      try {
        const res = await fetch('/geofences/' + encodeURIComponent(id), { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao remover');
        renderGeofences(data.geofences || []);
        statusEl.className = 'status success';
        statusEl.textContent = '🗑️ Geofence removido.';
        setTimeout(() => {
          statusEl.className = 'status';
        }, 2500);
      } catch (error) {
        statusEl.className = 'status error';
        statusEl.textContent = `❌ Erro: ${error.message}`;
      }
    }

    loadCueOptions();
    if (SHOW_GEOFENCES_UI) {
      const geoSection = document.getElementById('geofencesSection');
      if (geoSection) geoSection.style.display = '';
      loadGeofences();
    }
  </script>
</body>
</html>
