name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build @biteexpress/shared
        run: npm run build -w @biteexpress/shared

      - name: Typecheck biteexpress-driver-clean
        run: npm run typecheck:app

      - name: Typecheck biteexpress-control
        run: npm run typecheck:control

      - name: Syntax check notification-server
        run: node --check notification-server/server.js
